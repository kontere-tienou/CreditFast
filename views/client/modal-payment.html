<!-- ====================================================================
     [MODAL] PAIEMENT D'ÉCHÉANCE MOBILE MONEY (DEMANDEUR CIF)
     ==================================================================== -->
<div id="client-payment-modal" class="modal" style="display: none; position: fixed; inset: 0; z-index: 2000; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px);">
  <div class="modal-dialog" style="max-width: 500px; width: 92%; background: var(--bg-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-2xl); border: 1px solid var(--border-color); overflow: hidden;">
    
    <!-- Modal Header -->
    <div class="modal-header" style="padding: 1.25rem 1.5rem; background: linear-gradient(135deg, var(--cif-emerald-500), var(--cif-emerald-600)); color: white;">
      <div>
        <h4 style="font-size: 1.1rem; font-weight: 800; margin: 0; color: white;">
          <i class="fas fa-mobile-screen mr-2"></i> Règlement d'Échéance CIF
        </h4>
        <span style="font-size: 0.76rem; color: #d1fae5;">Paiement sécurisé par passerelle Mobile Money UEMOA</span>
      </div>
      <button class="modal-close-btn" style="color: white; background: rgba(255,255,255,0.2); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="App.closeClientPaymentModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body" style="padding: 1.5rem;">
      <form id="client-payment-form" onsubmit="App.submitClientPayment(event)">
        <!-- Summary Box -->
        <div style="background: var(--bg-body); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px;">
            <span>Prêt Concerné :</span>
            <strong style="color: var(--text-primary);">REQ-2025-0412 (Tissus Wax)</strong>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px;">
            <span>Échéance visée :</span>
            <strong style="color: var(--cif-gold-700);" id="payment-modal-due-label">Échéance N° 3 (05/09/2026)</strong>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border-color); padding-top: 6px; margin-top: 6px;">
            <span style="font-weight: 700; font-size: 0.85rem;">Montant à Débiter :</span>
            <strong style="font-size: 1.35rem; color: var(--primary-700); font-family: var(--font-family-code);" id="payment-modal-amount-label">235 000 FCFA</strong>
          </div>
        </div>

        <!-- Provider Selection -->
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="font-size: 0.8rem; font-weight: 700;">Sélectionnez votre moyen de paiement *</label>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;" id="momo-provider-buttons">
            <label class="momo-option-btn active" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 0.85rem; border: 2px solid #ff7900; background: rgba(255, 121, 0, 0.06); border-radius: var(--radius-md); cursor: pointer;">
              <input type="radio" name="momo_provider" value="Orange Money" checked style="accent-color: #ff7900;">
              <span style="font-weight: 700; font-size: 0.82rem; color: var(--text-primary);">Orange Money</span>
            </label>
            <label class="momo-option-btn" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 0.85rem; border: 1px solid var(--border-color); background: var(--bg-surface); border-radius: var(--radius-md); cursor: pointer;">
              <input type="radio" name="momo_provider" value="Wave" style="accent-color: #1dc5d8;">
              <span style="font-weight: 700; font-size: 0.82rem; color: var(--text-primary);">Wave Sénégal</span>
            </label>
            <label class="momo-option-btn" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 0.85rem; border: 1px solid var(--border-color); background: var(--bg-surface); border-radius: var(--radius-md); cursor: pointer;">
              <input type="radio" name="momo_provider" value="Moov Money" style="accent-color: #005ba4;">
              <span style="font-weight: 700; font-size: 0.82rem; color: var(--text-primary);">Moov Money</span>
            </label>
            <label class="momo-option-btn" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.65rem 0.85rem; border: 1px solid var(--border-color); background: var(--bg-surface); border-radius: var(--radius-md); cursor: pointer;">
              <input type="radio" name="momo_provider" value="MTN MoMo" style="accent-color: #ffcc00;">
              <span style="font-weight: 700; font-size: 0.82rem; color: var(--text-primary);">MTN MoMo</span>
            </label>
          </div>
        </div>

        <!-- Phone Number Input -->
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" style="font-size: 0.8rem;">Numéro de Compte Mobile Money *</label>
          <div style="display: flex; gap: 0.5rem;">
            <span style="padding: 0.5rem 0.75rem; background: var(--bg-body); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 700;">+221</span>
            <input type="tel" id="payment-phone-number" class="form-control" value="77 540 88 12" required style="font-size: 0.9rem; font-weight: 600;">
          </div>
          <span style="font-size: 0.72rem; color: var(--text-subtle); margin-top: 4px; display: block;">Une demande de confirmation USSD / Push vous sera transmise sur votre téléphone.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-confirm-momo-pay" class="btn btn-success btn-lg" style="width: 100%; justify-content: center;">
          <i class="fas fa-lock mr-2"></i> Confirmer le Paiement de 235 000 FCFA
        </button>
      </form>
    </div>
  </div>
</div>
