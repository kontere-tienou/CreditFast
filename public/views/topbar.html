<!-- ==========================================================================
     2. Top Navigation Bar
     ========================================================================== -->
<header id="topbar">
  <div class="topbar-left">
    <!-- Drawer / Sidebar Toggle Button -->
    <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="Basculer le menu latéral (Drawer)">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Global Quick Search (Desktop & Expandable Mobile) -->
    <div class="search-container" id="topbar-search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="global-search-input" class="search-input" placeholder="Rechercher...">
      <button id="search-close-mobile-btn" class="search-close-mobile-btn" title="Fermer la recherche">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Mobile Search Trigger Button (Only visible on small mobile screens) -->
    <button id="mobile-search-trigger-btn" class="topbar-action-btn mobile-search-btn" title="Ouvrir la recherche rapide">
      <i class="fas fa-search"></i>
    </button>

    <!-- Live Date & Real-Time Clock Display -->
    <div class="topbar-datetime" id="topbar-datetime" title="Heure locale réseau CIF / UEMOA">
      <i class="far fa-clock"></i>
      <span id="topbar-clock-display">Chargement...</span>
    </div>
  </div>

  <div class="topbar-right">
    <!-- Offline Mode Indicator Badge -->
    <div id="topbar-offline-badge" class="badge" style="display: none; background: rgba(245, 158, 11, 0.15); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.3); font-size: 0.72rem; padding: 0.3rem 0.6rem; align-items: center; gap: 0.35rem;" title="Mode hors-ligne actif : Données en cache local disponibles">
      <i class="fas fa-wifi"></i> <span>Hors-Ligne (Cache Actif)</span>
    </div>

    <!-- Active Role Badge Pill (Populated dynamically by active user) 
    <span id="user-role-pill-badge" class="badge user-role-pill"></span>

     Dark / Light Mode Toggle 
    <button id="theme-toggle-btn" class="topbar-action-btn" title="Changer de thème (Mode Sombre / Clair)">
      <i class="fas fa-moon"></i>
    </button>-->

    <!-- Notifications Bell -->
    <div class="notif-dropdown-container" style="position: relative;">
      <button id="notif-bell-btn" class="topbar-action-btn" title="Centre de Notifications" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span class="btn-badge" id="topbar-notif-badge">0</span>
      </button>
      <div id="notif-dropdown" class="notif-dropdown-menu" style="display: none;">
        <!-- Header -->
        <div class="notif-dropdown-header">
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <div class="notif-header-icon-box">
              <i class="fas fa-bell text-primary"></i>
            </div>
            <div>
              <h5 class="notif-header-title">Centre de Notifications</h5>
              <div class="notif-header-subtitle" id="notif-header-subtitle">Alertes & Flux Métier Dédié</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="badge badge-submitted" id="notif-unread-count-badge">0 Non Lue</span>
            <button class="notif-mark-read-btn" onclick="App.markAllNotificationsRead()" title="Marquer toutes les notifications comme lues">
              <i class="fas fa-check-double"></i>
            </button>
          </div>
        </div>

        <!-- Filter Chips (Injected dynamically based on active role) -->
        <div class="notif-filter-bar" id="notif-filter-bar">
          <!-- Injected dynamically -->
        </div>

        <!-- Notification List (Injected dynamically based on active role) -->
        <div class="notif-list" id="notif-list-container">
          <!-- Injected dynamically -->
        </div>

        <!-- Footer -->
        <div class="notif-dropdown-footer">
          <button class="notif-footer-btn" id="notif-footer-action-btn" onclick="App.handleNotifFooterAction();">
            <i class="fas fa-clock-rotate-left mr-1"></i> <span id="notif-footer-action-text">Consulter le journal d'activité</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Profile Icon with Dropbox & Country Flag Overlay -->
    <div class="profile-dropdown-container" id="profile-dropdown-container">
      <button class="topbar-profile-btn" id="topbar-profile-btn" aria-haspopup="true" aria-expanded="false" title="Mon Profil & Paramètres">
        <div class="topbar-avatar-wrap">
          <img id="topbar-avatar-img" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="topbar-avatar">
          <span class="avatar-flag-badge" id="topbar-avatar-flag" title="Pays de l'utilisateur"></span>
        </div>
        <div class="topbar-user-meta">
          <span id="topbar-user-name" class="topbar-user-name">Aminata Diallo</span>
          <span id="topbar-user-role" class="topbar-user-role">Analyste Risque</span>
        </div>
        <i class="fas fa-chevron-down profile-caret"></i>
      </button>

      <!-- Dropdown Menu Box -->
      <div id="profile-dropdown-menu" class="profile-dropdown-menu">
        <div class="profile-dropdown-header">
          <div class="topbar-avatar-wrap">
            <img id="menu-avatar-img" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80" alt="Avatar" class="menu-avatar">
            <span class="avatar-flag-badge lg" id="menu-avatar-flag" title="Pays de l'utilisateur"></span>
          </div>
          <div class="menu-user-details">
            <h6 id="menu-user-name">Aminata Diallo</h6>
            <span id="menu-user-email" class="menu-user-email">aminata.diallo@cif-ao.org</span>
            <span id="menu-user-role-badge" class="badge badge-submitted" style="font-size: 0.68rem; margin-top: 4px;">Analyste Risque V2</span>
          </div>
        </div>

        <div class="profile-dropdown-divider"></div>

        <ul class="profile-menu-list">
          <li>
            <a href="#" class="profile-menu-item" id="btn-edit-profile" onclick="App.openEditProfileModal(); return false;">
              <i class="fas fa-user-pen text-primary"></i>
              <span>Modifier mon Profil</span>
            </a>
          </li>
          <li>
            <a href="#" class="profile-menu-item" id="btn-open-settings" onclick="App.openSettingsModal(); return false;">
              <i class="fas fa-sliders-h text-secondary"></i>
              <span>Paramètres & Préférences</span>
            </a>
          </li>
          <li>
            <a href="#" class="profile-menu-item" onclick="App.showToast('Sécurité du compte : Authentification 2FA active', 'info'); return false;">
              <i class="fas fa-shield-halved text-emerald"></i>
              <span>Sécurité & Clés d'Accès</span>
            </a>
          </li>
          <li>
            <a href="#" class="profile-menu-item" onclick="App.showToast('Support CIF DigiCoop-WA+ disponible 24/7', 'info'); return false;">
              <i class="fas fa-circle-question text-info"></i>
              <span>Centre d'Aide CIF</span>
            </a>
          </li>
        </ul>

        <div class="profile-dropdown-divider"></div>

        <div class="profile-dropdown-footer">
          <button type="button" class="btn btn-danger-subtle btn-sm btn-action-logout" id="btn-topbar-logout" onclick="App.openLogoutConfirmModal(); return false;" style="width: 100%; justify-content: center;">
            <i class="fas fa-right-from-bracket mr-2"></i> Se Déconnecter
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
