<!-- ====================================================================
     VIEW: ANALYST DOSSIERS MANAGEMENT (DOSSIERS À INSTRUIRE)
     ==================================================================== -->
<section id="view-analyst-dossiers" class="app-view" style="display: none;">
  <div class="page-header">
    <div class="page-title-group">
      <h1>Dossiers à Instruire • Espace Analyste</h1>
      <div class="page-breadcrumb">
        <span>Analyse Risque</span> <i class="fas fa-chevron-right"></i>
        <span>Pipeline & Cold Start</span>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 1.25rem;">
    <div class="card-body" style="padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button class="btn btn-primary btn-sm" id="btn-filter-all" onclick="AppInteractions.renderRequestsTable('ALL', '', this)">Tous les dossiers</button>
        <button class="btn btn-secondary btn-sm" id="btn-filter-coldstart" onclick="AppInteractions.renderRequestsTable('COLD_START', '', this)" style="border-color: #10b981; color: #047857; background: #f0fdf4;">
          <i class="fas fa-seedling text-emerald mr-1"></i> Primo-Demandeurs (Cold Start)
        </button>
        <button class="btn btn-secondary btn-sm" onclick="AppInteractions.renderRequestsTable('ANALYSIS', '', this)">En Analyse</button>
        <button class="btn btn-secondary btn-sm" onclick="AppInteractions.renderRequestsTable('VERIFICATION_REQUIRED', '', this)">Vérif. Requise</button>
        <button class="btn btn-secondary btn-sm" onclick="AppInteractions.renderRequestsTable('COMMITTEE', '', this)">En Comité</button>
        <button class="btn btn-secondary btn-sm" onclick="AppInteractions.renderRequestsTable('APPROVED', '', this)">Approuvés</button>
      </div>
      <div style="font-size: 0.8rem; color: var(--text-subtle);">
        <i class="fas fa-info-circle"></i> Cliquez sur <strong>Analyser 360°</strong> pour voir le Reste à Vivre, l'OCR et simuler le Cold Start.
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table-custom">
        <thead>
          <tr>
            <th>N° Dossier / Date</th>
            <th>Client Emprunteur</th>
            <th>Montant & Durée</th>
            <th>Objet & Mode</th>
            <th>Capacité Nette</th>
            <th>Score & Confiance</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="requests-table-body">
          <!-- Dynamically Rendered -->
        </tbody>
      </table>
    </div>
  </div>
</section>
